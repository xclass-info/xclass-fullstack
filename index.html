    <script type="text/javascript">
      // Decodes the path 404.html encoded into the query string (see that
      // file) back into a real URL via history.replaceState, before React
      // Router mounts and reads window.location.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
