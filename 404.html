<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HappyResearch</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing: a direct visit or refresh
      // on a client route (e.g. /teacher/login) 404s here since no such
      // file exists. Encode the path into a query string and redirect to
      // the root, where index.html's inline script decodes it back into
      // a real history entry before React Router ever sees it.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
